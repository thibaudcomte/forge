<ion-header>
  <ion-toolbar>
    <ion-title
      >Log <ion-text color="primary">{{ workout().name }}</ion-text> Workout</ion-title
    >
  </ion-toolbar>
</ion-header>

<ion-content>
  <exercise [exercise]="currentExercise()"></exercise>
  @if (hasRemainingExercise()) {
    <ion-button
      expand="block"
      class="btn-gradient btn-large-radius ion-padding-vertical"
      [disabled]="!isCurrentExerciseComplete()"
      (click)="nextExercise()"
    >
      Next Exercise
      <ion-icon name="arrow-forward-outline" slot="end"></ion-icon>
    </ion-button>
  } @else {
    <ion-button expand="block" class="btn-gradient btn-large-radius ion-padding-vertical" (click)="save()">
      Finish & Save Workout
      <ion-icon name="checkmark-circle-outline" slot="end"></ion-icon>
    </ion-button>
  }
  <ion-button
    id="go-to-exercise"
    expand="block"
    class="ion-padding-vertical btn-large-radius"
    fill="outline"
    color="medium"
  >
    <ion-icon name="list-circle-outline" slot="start"></ion-icon>
    Explore Exercises
  </ion-button>
  <ion-action-sheet
    trigger="go-to-exercise"
    header="Choose Exercise"
    [buttons]="exercisesActionSheetButtons()"
    (didDismiss)="onPickExerciseDone($event)"
  >
  </ion-action-sheet>
</ion-content>
